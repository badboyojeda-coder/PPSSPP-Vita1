name: Build PPSSPP Vita VPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-vita:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Vita port sources
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f vita/platform/vita_main.cpp ]; then
            echo "::error::Falta vita/platform/vita_main.cpp en el repositorio publicado."
            exit 1
          fi

          if ! grep -q 'option(VITA ' upstream/ppsspp/CMakeLists.txt; then
            echo "::error::El submodulo PPSSPP no contiene las modificaciones CMake para Vita."
            exit 1
          fi

      - name: Fix ENet POSIX header for Vita
        shell: bash
        run: |
          set -euo pipefail

          ENET="upstream/ppsspp/ext/aemu_postoffice/ext/enet/enet.h"
          test -f "$ENET"

          # sys/ioctl.h no existe en el SDK de Vita y esta cabecera
          # solo lo necesita para la implementación específica de Windows.
          sed -i '/^[[:space:]]*#include <sys\/ioctl\.h>[[:space:]]*$/d' "$ENET"

          if grep -n 'sys/ioctl.h' "$ENET"; then
            echo "::error::No se pudo retirar la inclusión incompatible de ENet."
            exit 1
          fi

          echo "ENet corregido para la compilación Vita."

          # Configurar ENet para las limitaciones de Vita.
          python3 - "$ENET" "upstream/ppsspp/ext/CMakeLists.txt" <<'PYTHON'
          import sys
          from pathlib import Path

          enet_path = Path(sys.argv[1])
          header = enet_path.read_text()
          if "#ifndef SOMAXCONN" not in header:
              marker = "#include <netinet/tcp.h>"
              if marker not in header:
                  raise SystemExit("No se encontró el include POSIX de ENet")
              header = header.replace(marker, marker + "\n#ifndef SOMAXCONN\n#define SOMAXCONN 128\n#endif", 1)
              enet_path.write_text(header)

          client_path = Path("upstream/ppsspp/ext/aemu_postoffice/client/enet.c")
          client_lines = client_path.read_text().splitlines()
          patched = 0

          for i, line in enumerate(client_lines):
              if line.strip() != "#ifdef __PSP__":
                  continue

              following = i + 1
              while following < len(client_lines) and not client_lines[following].strip():
                  following += 1

              if following < len(client_lines) and client_lines[following].strip() in ("// just v4", "// no v6 support"):
                  indent = line[:len(line) - len(line.lstrip())]
                  client_lines[i] = indent + "#if defined(__PSP__) || defined(ENET_IPV4_ONLY)"
                  patched += 1

          if patched != 2:
              raise SystemExit(f"Se esperaban 2 condiciones PSP; se corrigieron {patched}")

          client_path.write_text("\n".join(client_lines) + "\n")
          print("ENet client: selección IPv4 corregida para Vita.")
          import re

          cmake_path = Path(sys.argv[2])
          cmake = cmake_path.read_text()

          for target in ("aemu_postoffice_client", "aemu_postoffice_server"):
              definition = f"target_compile_definitions({target} PRIVATE ENET_IPV4_ONLY)"
              if definition in cmake:
                  continue

              pattern = rf"add_library\({target}\s+STATIC\s+.*?\)"
              match = re.search(pattern, cmake, re.DOTALL)
              if not match:
                  raise SystemExit(f"No se encontró el objetivo {target}")

              cmake = cmake[:match.end()] + "\n" + definition + cmake[match.end():]

          cmake_path.write_text(cmake)
          print("ENet: IPv4 exclusivo y SOMAXCONN configurados para Vita.")
          PYTHON

      - name: Configure armips POSIX filesystem for Vita
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path("upstream/ppsspp/ext/armips/CMakeLists.txt")
          source = path.read_text()

          marker = "add_library(armips STATIC)"
          definition = "target_compile_definitions(armips PRIVATE GHC_OS_BSD GHC_OS_DETECTED)"

          if definition in source:
              print("armips ya tiene GHC_OS_BSD.")
          else:
              if source.count(marker) != 1:
                  raise SystemExit("No se encontró una única declaración de armips.")

              source = source.replace(
                  marker,
                  marker + "\n" + definition,
                  1
              )
              path.write_text(source)
              print("armips configurado con GHC_OS_BSD para Vita.")

          PYTHON

          grep -n -A2 'add_library(armips STATIC)' upstream/ppsspp/ext/armips/CMakeLists.txt
          grep -q 'target_compile_definitions(armips PRIVATE GHC_OS_BSD GHC_OS_DETECTED)' upstream/ppsspp/ext/armips/CMakeLists.txt

      - name: Build and package with VitaSDK
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            vitasdk/vitasdk:2026.08 \
            bash -lc '
              set -euo pipefail

              vdpm install vitaGL

              cmake -S upstream/ppsspp -B build-vita \
                -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
                -DCMAKE_BUILD_TYPE=Release \
                -DVITA=ON \
                -DUSING_GLES2=ON \
                -DUSE_FFMPEG=OFF \
                -DUSE_DISCORD=OFF \
                -DUSE_MINIUPNPC=OFF \
                -DUSE_SYSTEM_LIBPNG=OFF \
                -DUSE_SYSTEM_LIBZIP=OFF \
                -DUSE_SYSTEM_ZSTD=OFF \
                -DUSE_SYSTEM_LIBCHDR=OFF \
                -DUSE_SYSTEM_FREETYPE=OFF \
                -DUNITTEST=OFF \
                -DATLAS_TOOL=OFF \
                -DLIBRETRO=OFF \
                -DHEADLESS_CROSS=OFF

              cmake --build build-vita --parallel 2

              ELF="$(find build-vita -type f \
                \( -name PPSSPPVita.elf -o -name PPSSPPVita \) \
                -print -quit)"

              if [ -z "$ELF" ]; then
                echo "No se encontro el ejecutable PPSSPPVita."
                find build-vita -type f -executable
                exit 1
              fi

              test -d build-vita/assets
              test -f upstream/ppsspp/icons/icon-114.png

              PKG="$PWD/build-vita/package"
              mkdir -p "$PKG/sce_sys"

              vita-elf-create "$ELF" "$PKG/PPSSPPVita.velf"
              vita-make-fself -c "$PKG/PPSSPPVita.velf" "$PKG/eboot.bin"

              vita-mksfoex \
                -s TITLE_ID=PPSSV0001 \
                "PPSSPP Vita" \
                "$PKG/param.sfo"

              vita-pack-vpk \
                -s "$PKG/param.sfo" \
                -b "$PKG/eboot.bin" \
                -a "$PWD/build-vita/assets=assets" \
                -a "$PWD/upstream/ppsspp/icons/icon-114.png=sce_sys/icon0.png" \
                "$PKG/PPSSPP-Vita.vpk"

              test -s "$PKG/PPSSPP-Vita.vpk"
              ls -lh "$PKG/PPSSPP-Vita.vpk"
            '

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-Vita-VPK
          path: build-vita/package/PPSSPP-Vita.vpk
          if-no-files-found: error
          retention-days: 14
